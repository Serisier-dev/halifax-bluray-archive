<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Playfair+Display:wght@700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f14;--surface:#141720;--border:#252935;
  --accent:#4f9cf9;--accent2:#c084fc;--text:#e2e8f4;
  --muted:#6b7691;--success:#34d399;--warn:#fbbf24;
}
body{font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh}
header{padding:1.2rem 2rem .9rem;border-bottom:1px solid var(--border);display:flex;align-items:flex-end;gap:1rem;flex-wrap:wrap}
.logo-block h1{font-family:'Playfair Display',serif;font-size:1.4rem;letter-spacing:-.02em;line-height:1}
.logo-block p{font-size:.6rem;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin-top:3px}
.tag{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:2px;border:1px solid}
.tag-blue{color:var(--accent);border-color:var(--accent)}
.tag-green{color:var(--success);border-color:var(--success)}
.tag-warn{color:var(--warn);border-color:var(--warn)}
.source-link{text-decoration:none}.source-link:hover{background:rgba(79,156,249,.12)}
.title-link{color:var(--text);text-decoration:none;border-bottom:1px dotted var(--muted)}
.title-link:hover{color:var(--accent);border-color:var(--accent)}
/* ENRICH BANNER */
#enrichBanner{background:var(--surface);border-bottom:1px solid var(--border);padding:.6rem 2rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
#enrichBanner.hidden{display:none}
.enrich-msg{font-size:.68rem;color:var(--muted);flex:1}
.enrich-msg strong{color:var(--warn)}
.progress-wrap{min-width:120px;max-width:180px}
.progress-label{font-size:.58rem;color:var(--muted);margin-bottom:3px}
.progress-track{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--warn);border-radius:2px;transition:width .4s}
.btn{font-family:'DM Mono',monospace;font-size:.68rem;padding:.4rem .85rem;border-radius:4px;cursor:pointer;border:1px solid;transition:all .15s;white-space:nowrap}
.btn-warn{background:var(--warn);border-color:var(--warn);color:#0d0f14;font-weight:500}
.btn-warn:hover{opacity:.85}
.btn-warn:disabled{opacity:.4;cursor:not-allowed}
.btn-outline{background:transparent;border-color:var(--border);color:var(--muted)}
.btn-outline:hover{border-color:var(--muted);color:var(--text)}
/* CONTROLS */
.controls{padding:.6rem 2rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
input[type=text]{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:.72rem;padding:.42rem .75rem;border-radius:4px;outline:none;transition:border-color .2s}
input[type=text]:focus{border-color:var(--accent)}
input::placeholder{color:var(--muted)}
#searchTitle{width:200px}
#searchPerson{width:145px}
select{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:.67rem;padding:.42rem .65rem;border-radius:4px;outline:none;cursor:pointer}
.stats{margin-left:auto;font-size:.62rem;color:var(--muted);white-space:nowrap}
.stats span{color:var(--text)}
/* TABLE */
.list-wrap{padding:.5rem 2rem 3rem}
table{width:100%;border-collapse:collapse;font-size:.7rem}
thead tr{border-bottom:1px solid var(--border)}
th{text-align:left;padding:.5rem .6rem;font-size:.57rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400;cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--text)}
th.sorted{color:var(--accent)}
td{padding:.42rem .6rem;border-bottom:1px solid rgba(37,41,53,.4);vertical-align:top;line-height:1.5}
tr:hover td{background:var(--surface)}
.c-num{color:var(--muted);text-align:right;width:36px;font-size:.57rem}
.c-year{color:var(--accent2);text-align:center;width:48px;font-size:.68rem}
.c-genre{width:130px}
.c-person{font-size:.62rem;width:160px;line-height:1.7}
.badge{display:inline-block;padding:1px 5px;border-radius:2px;border:1px solid rgba(192,132,252,.3);color:var(--accent2);font-size:.56rem;margin:1px 2px 1px 0;white-space:nowrap}
.dir{color:var(--text);font-size:.65rem}
.cast-item{color:var(--muted)}
.pending{color:var(--border);font-style:italic;font-size:.6rem}
.new-badge{display:inline-block;padding:1px 5px;border-radius:2px;background:rgba(251,191,36,.15);color:var(--warn);font-size:.55rem;margin-left:4px;border:1px solid rgba(251,191,36,.3);vertical-align:middle}
.empty{text-align:center;padding:3rem;color:var(--muted);font-size:.75rem}
.export-row{padding:.6rem 2rem;border-top:1px solid var(--border);display:flex;gap:.6rem;align-items:center}
.export-row span{font-size:.62rem;color:var(--muted)}
@media (max-width:600px){
  header{padding:1rem .75rem .8rem}
  .controls{padding:.6rem .75rem}
  #searchTitle{width:100%}
  .stats{margin-left:0}
  .list-wrap{padding:.5rem .75rem 3rem;overflow-x:auto;max-width:100vw}
  table{min-width:650px}
  .export-row{padding:.6rem .75rem}
}
</style>
</head>

</div>

  <select id="yearTo" onchange="render()"><option value="">Year to…</option></select>
  <select id="sortCol" onchange="render()">
    <option value="idx">Sort: Acquired</option>
    <option value="title">Sort: Title</option>
    <option value="release">Sort: Release Year</option>
  </select>
  <select id="sortDir" onchange="render()">
    <option value="asc">↑ Asc</option>
    <option value="desc">↓ Desc</option>
  </select>
  <div class="stats" id="stats"></div>
</div>

<div class="list-wrap">
  <table>
    <thead>
      <tr>
        <th class="c-num">#</th>
        <th onclick="setSort('title')">Title</th>
        <th onclick="setSort('release')">Year</th>
        <th>Genres</th>
        <th>Director / Cast</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">No titles match.</div>
</div>

<div class="export-row">
  <span>Export:</span>
  <button class="btn btn-outline" onclick="exportCSV()">CSV</button>
  <button class="btn btn-outline" onclick="exportTXT()">Plain Text</button>
</div>

DATA.forEach((d,i) => d.i = i);

/* ── Runtime state ───────────────────────────────────── */
// extra = enrichment for titles NOT in BASE (new additions)
let extra = {};
let sortCol = 'idx', sortDir = 'asc';

function getEnrich(title) {
  return BASE[title] || extra[title] || null;
}

/* ── Init ─────────────────────────────────────────────── */
async function init() {
  try {
    const r = await window.storage.get('bluray_extra_enriched');
    if (r && r.value) extra = JSON.parse(r.value);
  } catch(e) {}

  // Find titles not in BASE and not yet in extra
  const newTitles = DATA.filter(d => !BASE[d.t] && !extra[d.t]);
  if (newTitles.length > 0) {
    document.getElementById('enrichBanner').classList.remove('hidden');
    document.getElementById('newCount').textContent = newTitles.length;
    document.getElementById('enrichBtn').textContent = `Enrich ${newTitles.length} New Titles`;
    document.getElementById('newTag').textContent = newTitles.length + ' new titles';
    document.getElementById('newTag').style.display = 'inline-block';
  }

  document.getElementById('totalTag').textContent = DATA.length + ' titles';
  buildFilters();
  render();
}

/* ── Filters ──────────────────────────────────────────── */
function buildFilters() {
  const genres = new Set(), years = new Set();
  DATA.forEach(d => {
    const e = getEnrich(d.t);
    if (e) {
      (e.genres||[]).forEach(g => genres.add(g));
      if (e.year) years.add(e.year);
    }
  });
  const gf = document.getElementById('genreFilter');
  gf.innerHTML = '<option value="">All Genres</option>';
  [...genres].sort().forEach(g => { const o=document.createElement('option'); o.value=g; o.textContent=g; gf.appendChild(o); });

  const sortedYears = [...years].sort((a,b)=>a-b);
  const yFrom = document.getElementById('yearFrom');
  const yTo = document.getElementById('yearTo');
  yFrom.innerHTML = '<option value="">Year from…</option>';
  yTo.innerHTML = '<option value="">Year to…</option>';
  sortedYears.forEach(y => {
    [yFrom,yTo].forEach(sel => { const o=document.createElement('option'); o.value=y; o.textContent=y; sel.appendChild(o); });
  });
}

/* ── Enrichment ───────────────────────────────────────── */
let enriching = false;
async function startEnrich() {
  if (enriching) return;
  enriching = true;
  const btn = document.getElementById('enrichBtn');
  btn.disabled = true;
  document.getElementById('progressWrap').style.display = 'block';

  const newTitles = DATA.filter(d => !BASE[d.t] && !extra[d.t]).map(d => d.t);
  const BATCH = 25;
  let done = 0;

  for (let i = 0; i < newTitles.length; i += BATCH) {
    const batch = newTitles.slice(i, i + BATCH);
    await enrichBatch(batch);
    done = Math.min(i + BATCH, newTitles.length);
    const pct = Math.round(done / newTitles.length * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = `${done} / ${newTitles.length}`;
    try { await window.storage.set('bluray_extra_enriched', JSON.stringify(extra)); } catch(e){}
    render();
  }

  enriching = false;
  document.getElementById('enrichBanner').classList.add('hidden');
  document.getElementById('newTag').style.display = 'none';
  buildFilters();
  render();
}

async function enrichBatch(titles) {
  const prompt = `You are a movie database. For each title return a JSON array.
Each element: "title" (exact), "year" (int or null), "genres" (1-3 from: Action, Animation, Comedy, Documentary, Drama, Fantasy, Horror, Musical, Romance, Sci-Fi, Thriller, Western, World Cinema, Family, TV Series), "director" (string or null), "cast" (array of up to 3 names).
Respond ONLY with valid JSON array, no markdown.

Titles:
${titles.map((t,i)=>`${i+1}. ${t}`).join('\n')}`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: 'Respond ONLY with valid JSON array. No markdown.',
        messages: [{role:'user', content: prompt}]
      })
    });
    const data = await resp.json();
    const text = (data.content?.[0]?.text || '[]').replace(/```json|```/g,'').trim();
    const results = JSON.parse(text);
    results.forEach(r => {
      if (r.title) extra[r.title] = {year:r.year||null, genres:r.genres||[], director:r.director||null, cast:r.cast||[]};
    });
  } catch(e) { console.warn('Batch failed', e); }
}

/* ── Render ───────────────────────────────────────────── */
function setSort(col) {
  if (sortCol===col) sortDir = sortDir==='asc'?'desc':'asc';
  else { sortCol=col; sortDir='asc'; }
  document.getElementById('sortCol').value = sortCol;
  document.getElementById('sortDir').value = sortDir;
  render();
}

function render() {
  sortCol = document.getElementById('sortCol').value;
  sortDir = document.getElementById('sortDir').value;
  const q = document.getElementById('searchTitle').value.toLowerCase();
  const pq = document.getElementById('searchPerson').value.toLowerCase();
  const genre = document.getElementById('genreFilter').value;
  const yf = parseInt(document.getElementById('yearFrom').value)||0;
  const yt = parseInt(document.getElementById('yearTo').value)||9999;

  let filtered = DATA.filter(d => {
    if (!d.t.toLowerCase().includes(q)) return false;
    const e = getEnrich(d.t);
    if (pq) {
      if (!e) return false;
      const hay = ((e.director||'') + ' ' + (e.cast||[]).join(' ')).toLowerCase();
      if (!hay.includes(pq)) return false;
    }
    if (genre) {
      if (!e || !(e.genres||[]).includes(genre)) return false;
    }
    if (e && e.year && (e.year < yf || e.year > yt)) return false;
    return true;
  });

  filtered.sort((a,b) => {
    let va, vb;
    const ea = getEnrich(a.t), eb = getEnrich(b.t);
    if (sortCol==='release') { va=(ea&&ea.year)||0; vb=(eb&&eb.year)||0; }
    else if (sortCol==='title') { va=a.t.toLowerCase(); vb=b.t.toLowerCase(); }
    else { va=a.i; vb=b.i; }
    if (va<vb) return sortDir==='asc'?-1:1;
    if (va>vb) return sortDir==='asc'?1:-1;
    return 0;
  });

  document.getElementById('stats').innerHTML = `<span>${filtered.length}</span> of <span>${DATA.length}</span>`;

  const isNew = t => !BASE[t];
  const rows = filtered.map((d,i) => {
    const e = getEnrich(d.t);
    const yr = e ? (e.year||'—') : '<span class="pending">—</span>';
    const genres = e ? (e.genres||[]).map(g=>`<span class="badge">${esc(g)}</span>`).join('') : '<span class="pending">—</span>';
    const people = e
      ? [e.director?`<span class="dir">${esc(e.director)}</span>`:'']
          .concat((e.cast||[]).map(c=>`<span class="cast-item">${esc(c)}</span>`))
          .filter(Boolean).join('<br>')
      : '<span class="pending">—</span>';
    const newMark = isNew(d.t) ? '<span class="new-badge">new</span>' : '';
    return `<tr>
      <td class="c-num">${i+1}</td>
      <td>${d.u ? `<a class="title-link" href="${esc(d.u)}" target="_blank" rel="noopener noreferrer">${esc(d.t)}</a>` : esc(d.t)}${newMark}</td>
      <td class="c-year">${yr}</td>
      <td class="c-genre">${genres}</td>
      <td class="c-person">${people}</td>
    </tr>`;
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = rows.join('');
  document.getElementById('empty').style.display = rows.length===0?'block':'none';
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function getFiltered() {
  const q=document.getElementById('searchTitle').value.toLowerCase();
  const pq=document.getElementById('searchPerson').value.toLowerCase();
  const genre=document.getElementById('genreFilter').value;
  const yf=parseInt(document.getElementById('yearFrom').value)||0;
  const yt=parseInt(document.getElementById('yearTo').value)||9999;
  return DATA.filter(d=>{
    if(!d.t.toLowerCase().includes(q))return false;
    const e=getEnrich(d.t);
    if(pq&&(!e||!((e.director||'')+' '+(e.cast||[]).join(' ')).toLowerCase().includes(pq)))return false;
    if(genre&&(!e||!(e.genres||[]).includes(genre)))return false;
    if(e&&e.year&&(e.year<yf||e.year>yt))return false;
    return true;
  });
}

function exportCSV(){
  const rows=[['Title','Release Year','Genres','Director','Cast','Halifax Catalogue URL']];
  getFiltered().forEach(d=>{const e=getEnrich(d.t)||{};rows.push([d.t,e.year||'',(e.genres||[]).join('; '),e.director||'',(e.cast||[]).join('; '),d.u||''])});
  dl('halifax_bluray.csv',rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');
}
function exportTXT(){
  const lines=getFiltered().map((d,i)=>`${String(i+1).padStart(4)}. ${d.t}${(getEnrich(d.t)||{}).year?` (${getEnrich(d.t).year})`:''}`)
  dl('halifax_bluray.txt',lines.join('\n'),'text/plain');
}
function dl(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click()}

init();
